<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإرهاق الأكاديمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .en-text {
            color: #6b7280;
            font-size: 0.9rem;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="app"></div>

    <script>
        let currentQ = 0;
        let answers = {};
        let started = false;
        let showResults = false;

        const questions = [
            { id: 1, ar: "كم مرة تشعر بالتعب والإرهاق؟", en: "How often do you feel tired?", cat: "personal" },
            { id: 2, ar: "كم مرة تشعر بالإنهاك الجسدي؟", en: "How often are you physically exhausted?", cat: "personal" },
            { id: 3, ar: "كم مرة تشعر بالإنهاك العاطفي؟", en: "How often are you emotionally exhausted?", cat: "personal" },
            { id: 4, ar: "كم مرة تفكر: 'لا أستطيع المواصلة'؟", en: "How often do you think: 'I can't take it anymore'?", cat: "personal" },
            { id: 5, ar: "كم مرة تشعر بالضعف والعرضة للمرض؟", en: "How often do you feel weak and susceptible to illness?", cat: "personal" },
            { id: 6, ar: "كم مرة تشعر بالإحباط؟", en: "How often do you feel worn out?", cat: "personal" },
            { id: 7, ar: "هل تشعر بالإرهاق من الدراسة والمشاريع الجامعية؟", en: "Do you feel worn out at the end of the study day?", cat: "study" },
            { id: 8, ar: "هل تشعر بالإحباط من دراستك التخصصية؟", en: "Are you exhausted in the morning at the thought of another day?", cat: "study" },
            { id: 9, ar: "هل تشعر أن كل ساعة دراسة متعبة بالنسبة لك؟", en: "Do you feel that every hour of study is tiring for you?", cat: "study" },
            { id: 10, ar: "هل لديك طاقة كافية للعائلة والأصدقاء؟", en: "Do you have enough energy for family and friends?", cat: "study", rev: true },
            { id: 11, ar: "هل دراستك مرهقة عاطفياً؟", en: "Is your study emotionally exhausting?", cat: "study" },
            { id: 12, ar: "هل تشعر أن دراستك تستنزفك؟", en: "Does your study frustrate you?", cat: "study" },
            { id: 13, ar: "هل تشعر بالإرهاق بسبب المشاريع الدراسية؟", en: "Do you feel burnt out because of study projects?", cat: "study" },
            { id: 14, ar: "هل تجد صعوبة في التعامل مع زملائك؟", en: "Do you find it hard to work with classmates?", cat: "colleague" },
            { id: 15, ar: "هل تشعر بالإرهاق من التفاعل مع زملائك؟", en: "Do you feel drained working with classmates?", cat: "colleague" },
            { id: 16, ar: "هل التعامل مع المتطلبات الأكاديمية يستنزف طاقتك؟", en: "Does dealing with academic requirements drain your energy?", cat: "colleague" },
            { id: 17, ar: "هل تشعر بالإحباط عند التعامل مع صعوبات المواد؟", en: "Do you feel frustrated dealing with course difficulties?", cat: "colleague" },
            { id: 18, ar: "هل تتساءل كم ستتمكن من مواصلة الدراسة؟", en: "Do you wonder how long you can continue studying?", cat: "colleague" }
        ];

        const opts = [
            { v: 100, ar: "دائماً", en: "Always" },
            { v: 75, ar: "غالباً", en: "Often" },
            { v: 50, ar: "أحياناً", en: "Sometimes" },
            { v: 25, ar: "نادراً", en: "Seldom" },
            { v: 0, ar: "أبداً", en: "Never" }
        ];

        function answer(val) {
            const q = questions[currentQ];
            const actualVal = q.rev ? 100 - val : val;
            answers[q.id] = actualVal;

            if (currentQ < questions.length - 1) {
                currentQ++;
                render();
            } else {
                showResults = true;
                render();
            }
        }

        function calcScores() {
            const pq = questions.filter(q => q.cat === "personal");
            const sq = questions.filter(q => q.cat === "study");
            const cq = questions.filter(q => q.cat === "colleague");

            const ps = pq.reduce((sum, q) => sum + (answers[q.id] || 0), 0) / pq.length;
            const ss = sq.reduce((sum, q) => sum + (answers[q.id] || 0), 0) / sq.length;
            const cs = cq.reduce((sum, q) => sum + (answers[q.id] || 0), 0) / cq.length;
            const total = (ps + ss + cs) / 3;

            return { ps, ss, cs, total };
        }

        function getLevel(score) {
            if (score < 33) return { ar: "منخفض", en: "Low", col: "green" };
            if (score < 66) return { ar: "متوسط", en: "Moderate", col: "yellow" };
            return { ar: "مرتفع", en: "High", col: "red" };
        }

        function restart() {
            currentQ = 0;
            answers = {};
            started = false;
            showResults = false;
            render();
        }

        function start() {
            started = true;
            render();
        }

        function renderStart() {
            return `
                <div class="min-h-screen p-4 flex items-center justify-center">
                    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-gray-800">اختبار الإرهاق الأكاديمي</h1>
                            <div class="en-text">Academic Burnout Test</div>
                            
                            <p class="text-lg text-gray-600 mt-6">مقياس كوبنهاغن للإرهاق</p>
                            <div class="en-text">Copenhagen Burnout Inventory</div>
                            
                            <p class="text-sm text-gray-500 mt-4">لطلاب الجامعات</p>
                            <div class="en-text">For University Students</div>
                        </div>
                        
                        <div class="bg-blue-50 rounded-lg p-6 mb-6">
                            <h2 class="text-xl font-semibold text-gray-800">📋 عن الاختبار</h2>
                            <div class="en-text mb-4">About the Test</div>
                            
                            <div class="space-y-3 text-gray-700">
                                <div>
                                    <p>• يحتوي على 18 سؤالاً</p>
                                    <div class="en-text">Contains 18 questions</div>
                                </div>
                                <div>
                                    <p>• يستغرق حوالي 5 دقائق</p>
                                    <div class="en-text">Takes about 5 minutes</div>
                                </div>
                                <div>
                                    <p>• يقيس ثلاثة أبعاد: الإرهاق الشخصي، الدراسي، والاجتماعي</p>
                                    <div class="en-text">Measures three dimensions: Personal, Study-related, and Social burnout</div>
                                </div>
                                <div>
                                    <p>• النتائج فورية مع نصائح مخصصة</p>
                                    <div class="en-text">Instant results with personalized advice</div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-yellow-50 border-r-4 border-yellow-400 p-4 mb-6">
                            <p class="text-sm text-gray-700"><strong>ملاحظة:</strong> هذا الاختبار للتوعية فقط وليس تشخيصاً طبياً.</p>
                            <div class="en-text mt-2"><strong>Note:</strong> This test is for awareness only, not a medical diagnosis.</div>
                        </div>

                        <button onclick="start()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-lg transition-colors text-lg">
                            ابدأ الاختبار
                        </button>
                    </div>
                </div>
            `;
        }

        function renderQ() {
            const prog = ((currentQ + 1) / questions.length) * 100;
            const q = questions[currentQ];
            const catAr = q.cat === 'personal' ? 'الإرهاق الشخصي' : q.cat === 'study' ? 'الإرهاق الدراسي' : 'الإرهاق الاجتماعي';
            const catEn = q.cat === 'personal' ? 'Personal Burnout' : q.cat === 'study' ? 'Study-Related Burnout' : 'Social Burnout';

            return `
                <div class="min-h-screen p-4">
                    <div class="max-w-3xl mx-auto">
                        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <div>
                                    <span class="text-sm font-medium text-gray-600">السؤال ${currentQ + 1} من ${questions.length}</span>
                                    <div class="en-text">Question ${currentQ + 1} of ${questions.length}</div>
                                </div>
                                <span class="text-sm font-medium text-indigo-600">${Math.round(prog)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-indigo-600 h-2 rounded-full" style="width: ${prog}%"></div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-xl p-8">
                            <div class="mb-8">
                                <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-semibold px-3 py-1 rounded-full">${catAr}</span>
                                <div class="en-text">${catEn}</div>
                                
                                <h2 class="text-2xl font-bold text-gray-800 mt-4">${q.ar}</h2>
                                <div class="en-text text-base">${q.en}</div>
                            </div>

                            <div class="space-y-3">
                                ${opts.map(o => `
                                    <button onclick="answer(${o.v})" class="w-full text-right p-4 rounded-lg border-2 border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 transition-all">
                                        <div class="font-semibold text-gray-700">${o.ar}</div>
                                        <div class="en-text">${o.en}</div>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRes() {
            const s = calcScores();
            const tl = getLevel(s.total);
            const pl = getLevel(s.ps);
            const sl = getLevel(s.ss);
            const cl = getLevel(s.cs);

            const colClass = {
                green: 'bg-green-50 border-green-600 text-green-600',
                yellow: 'bg-yellow-50 border-yellow-600 text-yellow-600',
                red: 'bg-red-50 border-red-600 text-red-600'
            };

            let advice = '';
            if (s.total >= 66) {
                advice = `<div class="bg-red-50 rounded-lg p-5 border border-red-200 mb-4">
                    <h3 class="text-lg font-bold text-gray-800">⚠️ مستوى إرهاق مرتفع</h3>
                    <div class="en-text mb-3">High Burnout Level</div>
                    <ul class="space-y-2 text-gray-700">
                        <li>• تواصل مع المرشد الأكاديمي<div class="en-text">Contact your academic advisor</div></li>
                        <li>• خذ استراحة من الدراسة<div class="en-text">Take a break from studying</div></li>
                        <li>• مارس تمارين الاسترخاء<div class="en-text">Practice relaxation exercises</div></li>
                    </ul>
                </div>`;
            } else if (s.total >= 33) {
                advice = `<div class="bg-yellow-50 rounded-lg p-5 border border-yellow-200 mb-4">
                    <h3 class="text-lg font-bold text-gray-800">⚡ مستوى إرهاق متوسط</h3>
                    <div class="en-text mb-3">Moderate Burnout Level</div>
                    <ul class="space-y-2 text-gray-700">
                        <li>• نظم وقتك بشكل أفضل<div class="en-text">Better organize your time</div></li>
                        <li>• مارس الرياضة بانتظام<div class="en-text">Exercise regularly</div></li>
                        <li>• احصل على نوم كافٍ<div class="en-text">Get adequate sleep</div></li>
                    </ul>
                </div>`;
            } else {
                advice = `<div class="bg-green-50 rounded-lg p-5 border border-green-200 mb-4">
                    <h3 class="text-lg font-bold text-gray-800">✅ مستوى إرهاق منخفض</h3>
                    <div class="en-text mb-3">Low Burnout Level</div>
                    <ul class="space-y-2 text-gray-700">
                        <li>• حافظ على نمط حياتك الصحي<div class="en-text">Maintain your healthy lifestyle</div></li>
                        <li>• استمر في إدارة وقتك بشكل جيد<div class="en-text">Continue good time management</div></li>
                    </ul>
                </div>`;
            }

            return `
                <div class="min-h-screen p-4">
                    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
                        <h1 class="text-3xl font-bold text-gray-800 text-center">نتائج اختبار الإرهاق</h1>
                        <div class="en-text text-center mb-6">Burnout Test Results</div>
                        
                        <div class="${colClass[tl.col]} rounded-xl p-6 mb-6 border-2">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800">النتيجة الإجمالية</h2>
                                    <div class="en-text">Overall Result</div>
                                    <p class="text-lg font-semibold mt-2">مستوى الإرهاق: ${tl.ar}</p>
                                    <div class="en-text">Burnout Level: ${tl.en}</div>
                                </div>
                                <div class="text-4xl font-bold">${Math.round(s.total)}%</div>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-3 gap-4 mb-6">
                            <div class="${colClass[pl.col]} rounded-lg p-4 border">
                                <h3 class="font-semibold text-gray-800">الإرهاق الشخصي</h3>
                                <div class="en-text">Personal Burnout</div>
                                <div class="text-2xl font-bold mt-2">${Math.round(s.ps)}%</div>
                                <p class="text-sm mt-1">${pl.ar}</p>
                                <div class="en-text">${pl.en}</div>
                            </div>
                            <div class="${colClass[sl.col]} rounded-lg p-4 border">
                                <h3 class="font-semibold text-gray-800">الإرهاق الدراسي</h3>
                                <div class="en-text">Study-Related Burnout</div>
                                <div class="text-2xl font-bold mt-2">${Math.round(s.ss)}%</div>
                                <p class="text-sm mt-1">${sl.ar}</p>
                                <div class="en-text">${sl.en}</div>
                            </div>
                            <div class="${colClass[cl.col]} rounded-lg p-4 border">
                                <h3 class="font-semibold text-gray-800">الإرهاق الاجتماعي</h3>
                                <div class="en-text">Social Burnout</div>
                                <div class="text-2xl font-bold mt-2">${Math.round(s.cs)}%</div>
                                <p class="text-sm mt-1">${cl.ar}</p>
                                <div class="en-text">${cl.en}</div>
                            </div>
                        </div>

                        ${advice}

                        <button onclick="restart()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg">
                            إعادة الاختبار
                        </button>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!started) {
                app.innerHTML = renderStart();
            } else if (showResults) {
                app.innerHTML = renderRes();
            } else {
                app.innerHTML = renderQ();
            }
        }

        render();
    </script>
</body>
</html>
